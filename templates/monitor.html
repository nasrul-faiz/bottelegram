<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #a1a1aa;
        --green: #34d399;
        --red: #f87171;
        --border: #374151;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, var(--bg));
        color: var(--text);
      }
      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: 2.2rem;
      }
      .badge {
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: bold;
        border: 1px solid var(--border);
      }
      .online { background: rgba(52,211,153,0.15); color: var(--green); }
      .offline { background: rgba(248,113,113,0.15); color: var(--red); }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }
      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      }
      .label {
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .value {
        margin-top: 8px;
        font-size: 1.4rem;
        font-weight: 700;
        word-break: break-word;
      }
      .logs {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .logs-header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      pre {
        margin: 0;
        padding: 18px;
        max-height: 520px;
        overflow: auto;
        font-size: 0.88rem;
        line-height: 1.5;
        color: #dbeafe;
        background: #020817;
      }
      a {
        color: #8ec5ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Bot Monitor</h1>
        <div class="badge {{ 'online' if status == 'online' else 'offline' }}">
          {{ status.upper() }}
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="label">Bot</div>
          <div class="value">{{ bot }}</div>
        </div>
        <div class="card">
          <div class="label">Last seen</div>
          <div class="value">{{ last_seen }}</div>
        </div>
        <div class="card">
          <div class="label">Log file</div>
          <div class="value"><a href="/health">{{ log_path }}</a></div>
        </div>
      </div>

      <div class="logs">
        <div class="logs-header">
          <strong>Recent logs</strong>
          <span>{{ logs|length }} entries</span>
        </div>
        <pre>{% for line in logs %}{{ line }}
{% endfor %}</pre>
      </div>
    </div>
  </body>
</html>
